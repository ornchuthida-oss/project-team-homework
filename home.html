<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Grind | Craft Coffee Shop</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4a3728;      /* Deep Coffee Brown */
            --accent: #d4a373;       /* Warm Latte Gold */
            --dark: #221510;         /* Espresso Black */
            --light: #fefae0;        /* Cream White */
            --gray: #f4f1de;         /* Soft Background Gray */
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Navigation */
        header {
            background-color: var(--primary);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .logo {
            color: var(--light);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: var(--dark);
            padding: 0.8rem 2rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #c59262;
            transform: translateY(-2px);
        }

        /* Features Section */
        .features {
            padding: 5rem 10%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            background-color: var(--gray);
        }

        .feature-card {
            background: white;
            padding: 2.5rem;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .feature-card h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        /* Services Section (NEW) */
        .services {
            padding: 5rem 10%;
            text-align: center;
            background-color: var(--light);
        }

        .services h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 3rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            border-top: 5px solid var(--primary);
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-card h3 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        /* Menu Preview Section */
        .menu-preview {
            padding: 5rem 10%;
            text-align: center;
            background-color: var(--gray);
        }

        .menu-preview h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 3rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 1.5rem;
            border-radius: 6px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .item-info {
            text-align: left;
        }

        .item-info h4 {
            font-size: 1.2rem;
            color: var(--dark);
        }

        .item-info p {
            font-size: 0.9rem;
            color: #666;
        }

        .price {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: var(--light);
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .hero p { font-size: 1rem; }
            header { flex-direction: column; gap: 15px; }
            nav ul li { margin: 0 10px; }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">THE DAILY <span>GRIND</span></div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>Wake Up to Fresh Brew</h1>
        <p>Crafted with passionately sourced beans, roasted to perfection, and poured just for your perfect morning routine.</p>
        <a href="#menu" class="btn">Explore Menu</a>
    </section>
    
</body>
</html>
